name: Build AssaultCube

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Linux  -  Server (Standalone) build
  # ---------------------------------------------------------------------------
  linux-server:
    name: Linux Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            make \
            automake \
            autoconf \
            libtool \
            zlib1g-dev

      - name: Build server
        working-directory: source/src
        run: |
          make clean
          make server
          make server_install

      - name: Verify binary
        run: |
          test -f bin_unix/native_server && echo "Server OK" || exit 1

      - name: Upload Linux server
        uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: bin_unix/native_server

  # ---------------------------------------------------------------------------
  # Release – create a GitHub Release with build artifacts (push only)
  # Deletes all previous releases so only the latest build is available.
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    if: github.event_name == 'push'
    needs: [linux-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete previous releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --json tagName -q '.[].tagName' | while read -r tag; do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "Latest Build ($(date -u +%Y-%m-%d))" \
            --notes "Automated build from commit ${{ github.sha }}" \
            --latest \
            artifacts/linux-server/native_server

  # ---------------------------------------------------------------------------
  # Notify – post a build summary (runs on success or failure)
  # ---------------------------------------------------------------------------
  notify:
    name: Build Summary
    if: always() && github.event_name == 'push'
    needs: [linux-server, release]
    runs-on: ubuntu-latest
    steps:
      - name: Build notification
        run: |
          if [ "${{ needs.linux-server.result }}" = "success" ] && \
             [ "${{ needs.release.result }}" = "success" ]; then
            echo "## :white_check_mark: Build Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All jobs completed successfully for \`${{ github.sha }}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "A new release has been published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## :x: Build Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Linux Server | ${{ needs.linux-server.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Release | ${{ needs.release.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
