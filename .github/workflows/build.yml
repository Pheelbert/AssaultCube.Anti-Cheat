name: Build AssaultCube

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Windows 32-bit  -  Client (Release) + Server (Standalone), includes anticheat
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build client (Release)
        run: msbuild source\vcpp\assaultcube.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Build server (Standalone)
        run: msbuild source\vcpp\assaultcube.sln /p:Configuration=Standalone /p:Platform=Win32 /m

      - name: Verify binaries
        shell: bash
        run: |
          test -f bin_win32/ac_client.exe && echo "Client OK" || exit 1
          test -f bin_win32/ac_server.exe && echo "Server OK" || exit 1

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: bin_win32/ac_client.exe

      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: windows-server
          path: bin_win32/ac_server.exe

  # ---------------------------------------------------------------------------
  # Windows kernel-mode driver (WDM) - PhantiCheat anti-cheat driver
  # ---------------------------------------------------------------------------
  kernel-driver:
    name: Kernel Driver (WDK)
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows Driver Kit
        uses: microsoft/setup-wdk@v1

      - name: Build kernel driver (${{ matrix.configuration }})
        run: >
          msbuild source\src\anticheat\driver\phanticheat.vcxproj
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /m

      - name: Verify driver binary
        shell: bash
        run: |
          DRIVER_PATH="bin_win32/driver/${{ matrix.configuration }}/phanticheat.sys"
          test -f "$DRIVER_PATH" && echo "Driver OK (${{ matrix.configuration }})" || exit 1

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ matrix.configuration }}
          path: bin_win32/driver/${{ matrix.configuration }}/phanticheat.sys
