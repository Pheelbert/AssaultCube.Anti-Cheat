name: Build AssaultCube

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Windows  -  Client (Release) build
  # ---------------------------------------------------------------------------
  windows-client:
    name: Windows Client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build client (Release|Win32)
        run: msbuild source\vcpp\assaultcube.sln /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal

      - name: Verify binary
        shell: bash
        run: |
          test -f bin_win32/ac_client.exe && echo "Client OK" || exit 1

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: bin_win32/ac_client.exe

  # ---------------------------------------------------------------------------
  # Windows kernel-mode driver (WDM) - PhantiCheat anti-cheat driver
  # ---------------------------------------------------------------------------
  kernel-driver:
    name: Kernel Driver (WDK)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows Driver Kit
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'

          # Download the WDK 10 online installer (stable Microsoft redirect).
          Write-Host 'Downloading WDK installer...'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2272234' `
            -OutFile "$env:TEMP\wdksetup.exe"

          # Install WDK silently (includes headers, libs and MSBuild targets).
          Write-Host 'Installing WDK (this may take a few minutes)...'
          $proc = Start-Process -Wait -PassThru "$env:TEMP\wdksetup.exe" `
            -ArgumentList '/features','+','/quiet','/norestart','/ceip','off'
          if ($proc.ExitCode -ne 0) {
            Write-Error "WDK installation failed (exit code $($proc.ExitCode))"
            exit 1
          }

          # Expose the WDK root so MSBuild can locate the toolset & headers.
          $kitsRoot = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          if (-not $kitsRoot) {
            Write-Error 'WDK registry key not found after installation'
            exit 1
          }
          Write-Host "WDK installed at: $kitsRoot"
          echo "WDKContentRoot=$kitsRoot" >> $env:GITHUB_ENV

      - name: Build kernel driver (Release)
        run: >
          msbuild source\src\anticheat\driver\phanticheat.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /m

      - name: Verify driver binary
        shell: bash
        run: |
          test -f "bin_win32/driver/Release/phanticheat.sys" && echo "Driver OK (Release)" || exit 1

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-Release
          path: bin_win32/driver/Release/phanticheat.sys

  # ---------------------------------------------------------------------------
  # Linux  -  Server (Standalone) build
  # ---------------------------------------------------------------------------
  linux-server:
    name: Linux Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            make \
            automake \
            autoconf \
            libtool \
            zlib1g-dev

      - name: Build server
        working-directory: source/src
        run: |
          make clean
          make server
          make server_install

      - name: Verify binary
        run: |
          test -f bin_unix/native_server && echo "Server OK" || exit 1

      - name: Upload Linux server
        uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: bin_unix/native_server

  # ---------------------------------------------------------------------------
  # Release – create a GitHub Release with build artifacts (push only)
  # Deletes all previous releases so only the latest build is available.
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    if: github.event_name == 'push'
    needs: [windows-client, kernel-driver, linux-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete previous releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --json tagName -q '.[].tagName' | while read -r tag; do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "Latest Build ($(date -u +%Y-%m-%d))" \
            --notes "Automated build from commit ${{ github.sha }}" \
            --latest \
            artifacts/windows-client/ac_client.exe \
            artifacts/kernel-driver-Release/phanticheat.sys \
            artifacts/linux-server/native_server

  # ---------------------------------------------------------------------------
  # Notify – post a build summary (runs on success or failure)
  # ---------------------------------------------------------------------------
  notify:
    name: Build Summary
    if: always() && github.event_name == 'push'
    needs: [windows-client, kernel-driver, linux-server, release]
    runs-on: ubuntu-latest
    steps:
      - name: Build notification
        run: |
          if [ "${{ needs.windows-client.result }}" = "success" ] && \
             [ "${{ needs.kernel-driver.result }}" = "success" ] && \
             [ "${{ needs.linux-server.result }}" = "success" ] && \
             [ "${{ needs.release.result }}" = "success" ]; then
            echo "## :white_check_mark: Build Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All jobs completed successfully for \`${{ github.sha }}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "A new release has been published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## :x: Build Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Windows Client | ${{ needs.windows-client.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Kernel Driver | ${{ needs.kernel-driver.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Linux Server | ${{ needs.linux-server.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Release | ${{ needs.release.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
