name: Build AssaultCube

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Windows 32-bit  -  Client (Release) + Server (Standalone), includes anticheat
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build client (Release)
        run: msbuild source\vcpp\assaultcube.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Build server (Standalone)
        run: msbuild source\vcpp\assaultcube.sln /p:Configuration=Standalone /p:Platform=Win32 /m

      - name: Verify binaries
        shell: bash
        run: |
          test -f bin_win32/ac_client.exe && echo "Client OK" || exit 1
          test -f bin_win32/ac_server.exe && echo "Server OK" || exit 1

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: bin_win32/ac_client.exe

      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: windows-server
          path: bin_win32/ac_server.exe

  # ---------------------------------------------------------------------------
  # Windows kernel-mode driver (WDM) - PhantiCheat anti-cheat driver
  # ---------------------------------------------------------------------------
  kernel-driver:
    name: Kernel Driver (WDK)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Find Windows Driver Kit
        id: find-wdk
        shell: pwsh
        run: |
          # WDK is pre-installed on windows-latest runners.
          # Locate the latest WDK installation and expose it to MSBuild.
          $wdkRoot = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name 'KitsRoot10' |
                     Select-Object -ExpandProperty KitsRoot10
          if (-not $wdkRoot) {
            Write-Error "WDK not found on this runner"
            exit 1
          }
          Write-Host "WDK root: $wdkRoot"
          echo "WDK_ROOT=$wdkRoot" >> $env:GITHUB_ENV

      - name: Build kernel driver (Release)
        run: >
          msbuild source\src\anticheat\driver\phanticheat.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /m

      - name: Verify driver binary
        shell: bash
        run: |
          test -f "bin_win32/driver/Release/phanticheat.sys" && echo "Driver OK (Release)" || exit 1

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-Release
          path: bin_win32/driver/Release/phanticheat.sys

  # ---------------------------------------------------------------------------
  # Release – create a GitHub Release with all build artifacts (push only)
  # Deletes all previous releases so only the latest build is available.
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    if: github.event_name == 'push'
    needs: [windows, kernel-driver]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete previous releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --json tagName -q '.[].tagName' | while read -r tag; do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "Latest Build ($(date -u +%Y-%m-%d))" \
            --notes "Automated build from commit ${{ github.sha }}" \
            --latest \
            artifacts/windows-client/ac_client.exe \
            artifacts/windows-server/ac_server.exe \
            artifacts/kernel-driver-Release/phanticheat.sys

  # ---------------------------------------------------------------------------
  # Notify – post a build summary (runs on success or failure)
  # ---------------------------------------------------------------------------
  notify:
    name: Build Summary
    if: always() && github.event_name == 'push'
    needs: [windows, kernel-driver, release]
    runs-on: ubuntu-latest
    steps:
      - name: Build notification
        run: |
          if [ "${{ needs.windows.result }}" = "success" ] && \
             [ "${{ needs.kernel-driver.result }}" = "success" ] && \
             [ "${{ needs.release.result }}" = "success" ]; then
            echo "## :white_check_mark: Build Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All jobs completed successfully for \`${{ github.sha }}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "A new release has been published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## :x: Build Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Windows (MSVC) | ${{ needs.windows.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Kernel Driver | ${{ needs.kernel-driver.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Release | ${{ needs.release.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
