services:
  acserver:
    build: .
    ports:
      - "28763:28763/udp"
      - "28764:28764/udp"
    volumes:
      - ./config:/ac/config
      - ./logs:/ac/logs
      - dashboard-data:/ac/data
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "8080:8080"
    volumes:
      - dashboard-data:/data:ro
      - ./logs:/logs:ro
    environment:
      - AC_STATUS_FILE=/data/dashboard_status.json
      - AC_LOGS_DIR=/logs
    depends_on:
      - acserver
    restart: unless-stopped

volumes:
  dashboard-data:
